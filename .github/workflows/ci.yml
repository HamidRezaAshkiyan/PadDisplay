name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run PadDisplaySelfTest
        run: swift run PadDisplaySelfTest

      - name: Build and sign PadDisplay.app
        run: ./scripts/build-app.sh release
